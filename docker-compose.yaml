services:
  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/postgres:/var/lib/postgres
    restart: always

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    depends_on:
      - todoapp-postgres

  todoapp-env-alpine-socat:
    image: alpine/socat:1.8.0.3
    ports:
      - "127.0.0.1:5432:5432"
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    depends_on:
      - todoapp-postgres